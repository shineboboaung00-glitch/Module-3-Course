<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minn-Calculate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="w-100 p-3 border rounded shadow-lg">
      <h2 class="text-center font-bold mb-4 text-2xl">Minn-Calculate</h2>

      <input id="result"
        readonly
        type="text"
        class="border w-full p-3 rounded-lg mb-4 text-right text-2xl"
        value="0"
        id=""
      />

      <div class="grid grid-cols-4 gap-2">
        <button onclick="clearResult()" class="bg-red-700 p-3 rounded-lg">C</button>
        <button onclick="deleteResult()" class="bg-orange-500 p-3 rounded-lg">DEL</button>
        <button onclick="addValue('/')" class="bg-gray-500 p-3 rounded-lg">%</button>
        <button onclick="addValue('*')" class="bg-gray-500 p-3 rounded-lg">x</button>

        <button onclick="addValue('7')" class="bg-gray-500 p-3 rounded-lg">7</button>
        <button onclick="addValue('8')" class="bg-gray-500 p-3 rounded-lg">8</button>
        <button onclick="addValue('9')"  class="bg-gray-500 p-3 rounded-lg">9</button>
        <button onclick="addValue('-')"  class="bg-gray-500 p-3 rounded-lg">-</button>

        <button onclick="addValue('4')"  class="bg-gray-500 p-3 rounded-lg">4</button>
        <button onclick="addValue('5')"  class="bg-gray-500 p-3 rounded-lg">5</button>
        <button onclick="addValue('6')"  class="bg-gray-500 p-3 rounded-lg">6</button>
        <button onclick="addValue('+')"  class="bg-gray-500 p-3 rounded-lg">+</button>

        <button onclick="addValue('1')" class="bg-gray-500 p-3 rounded-lg">1</button>
        <button onclick="addValue('2')" class="bg-gray-500 p-3 rounded-lg">2</button>
        <button onclick="addValue('3')" class="bg-gray-500 p-3 rounded-lg">3</button>
        <button onclick="calculate()" class="bg-blue-800 p-3 rounded-lg row-span-2">=</button>

        <button onclick="addValue('**')"  class="bg-gray-500 p-3 rounded-lg">**</button>
        <button onclick="addValue('0')"  class="bg-gray-500 p-3 rounded-lg">0</button>
        <button onclick="addValue('.')"  class="bg-gray-500 p-3 rounded-lg">.</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
